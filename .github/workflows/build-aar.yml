name: Build libbox AAR
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.10'
          cache: false
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Clone sing-box v1.11.0
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/SagerNet/sing-box.git
      - name: Build AAR with utls
        run: |
          cd sing-box
          gomobile init
          gomobile bind -tags "with_clash_api,with_gvisor,with_utls" -target=android -androidapi=26 -o libbox.aar ./experimental/libbox
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar