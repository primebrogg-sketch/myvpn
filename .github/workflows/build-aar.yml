name: Build libbox AAR
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.10'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Set Android NDK env
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          echo "SDK_ROOT=$SDK_ROOT"
          NDK_DIR=$(ls -1d $SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "NDK_DIR=$NDK_DIR"
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi
          ls -la $SDK_ROOT/platforms/ 2>/dev/null
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$GOPATH/bin:$HOME/go/bin" >> $GITHUB_PATH
      - name: Clone sing-box v1.11.0
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/SagerNet/sing-box.git
          cd sing-box
          go mod download 2>&1
      - name: Build AAR with utls
        run: |
          cd sing-box
          gomobile bind -v \
            -ldflags "-checklinkname=0" \
            -tags "with_clash_api,with_gvisor,with_utls,badlinkname,tfogo_checklinkname0" \
            -target=android -androidapi=26 \
            -o libbox.aar ./experimental/libbox 2>&1
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar