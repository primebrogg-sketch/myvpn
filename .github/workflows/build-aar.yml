name: Build libbox AAR
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Set Android NDK env
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -1d $SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "NDK_DIR=$NDK_DIR"
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$HOME/go/bin:$GOPATH/bin" >> $GITHUB_PATH
      - name: Clone sing-box v1.11.0
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/SagerNet/sing-box.git
          cd sing-box
          go mod download 2>&1
      - name: Build AAR with utls
        run: |
          set -o pipefail
          cd sing-box
          gomobile bind -v \
            -tags "with_clash_api,with_gvisor,with_utls" \
            -target=android -androidapi=26 \
            -o libbox.aar ./experimental/libbox 2>&1 | tee ../build.log
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload AAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar